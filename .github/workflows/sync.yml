name: sync-ucas-homework

# 每天两次：北京 07:00 / 19:00（GitHub Actions 的 cron 用 UTC）
on:
  schedule:
    - cron: "0 23 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-ucas-homework
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取作业并生成日历
        env:
          UCAS_COOKIE: ${{ secrets.UCAS_COOKIE }}
        run: |
          python sync_all.py
          python make_ics.py --out tjtzt92xdju92mmxxjrg.ics

      - name: 提交更新
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tjtzt92xdju92mmxxjrg.ics
          if git diff --cached --quiet; then
            echo "内容无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: sync homework feed $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
